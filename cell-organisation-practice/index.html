<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellular organisation practice</title>
<style>
  :root { --ink:#1c2430; --line:#d5dbe3; --paper:#f6f7f9; --card:#fff; --accent:#1f4e79; --bad:#8c2f2f; --ok:#1d6b3a; }
  * { box-sizing: border-box; }
  body { margin:0; font:17px/1.45 "Segoe UI", "Noto Sans", sans-serif; color:var(--ink); background:var(--paper); }
  header { background:var(--accent); color:#fff; padding:18px 20px 16px; }
  header h1 { margin:0; font-size:1.35rem; font-weight:650; }
  header p { margin:6px 0 0; opacity:.92; font-size:.95rem; }
  main { max-width:760px; margin:0 auto; padding:18px 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 16px 14px; margin:0 0 14px; }
  label { display:block; font-weight:650; margin:0 0 6px; }
  input[type=text] { width:100%; font:inherit; padding:10px 12px; border:1px solid #b7c0cc; border-radius:8px; }
  .row { display:grid; grid-template-columns:1fr 140px; gap:12px; }
  button, .choice { font:inherit; cursor:pointer; }
  button.primary, button.ghost { border-radius:8px; padding:10px 14px; }
  button.primary { background:var(--accent); color:#fff; border:0; }
  button.ghost { background:#fff; border:1px solid #b7c0cc; }
  button:disabled { opacity:.45; cursor:default; }
  .sessions { display:grid; gap:10px; }
  .session { text-align:left; width:100%; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .session strong, .session .sub { display:block; }
  .session strong { color:var(--accent); }
  .bar { height:8px; background:#e4e9ef; border-radius:99px; overflow:hidden; margin:8px 0 14px; }
  .bar span { display:block; height:100%; background:var(--accent); }
  .stem { white-space:pre-wrap; margin:0 0 12px; }
  .opts { display:grid; gap:8px; }
  .choice { text-align:left; width:100%; border:1px solid #c5ced8; background:#fff; border-radius:10px; padding:10px 12px; }
  .choice.on { border-color:var(--accent); background:#eef4fa; }
  .nav { display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
  .score { font-size:1.8rem; font-weight:700; margin:0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .miss { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .small { color:#526070; font-size:.92rem; }
  table { width:100%; border-collapse:collapse; margin:8px 0; font-size:.95rem; }
  td { padding:4px 0; }
  @media (max-width:560px) { .row { grid-template-columns:1fr; } }
  @media print {
    header, .noprint { display:none !important; }
    body { background:#fff; }
    .card { border:0; }
  }
</style>

  <h1>Cellular organisation</h1>
  <p>Three practices. Enter your name and class, then choose one practice.</p>

<script id="bank" type="application/json">[{"id": "1", "title": "Practice 1", "subtitle": "Using a microscope", "items": [{"n": 1, "stem": "The letter \"b\" is viewed with a compound light microscope. Which image is seen?", "options": {"A": "b", "B": "d", "C": "p", "D": "q"}, "answer": "D", "trap": "B", "why": "The image is turned upside down and reversed left to right. Choosing d only turns it upside down.", "fix": "The image of b is q.", "topic": "Microscope image"}, {"n": 2, "stem": "Under the microscope, a water flea is seen swimming towards the left edge and then leaves the field. To bring the image back to the centre, the slide should be moved", "options": {"A": "to the left.", "B": "to the right.", "C": "upwards with the coarse adjustment knob.", "D": "by turning to a higher-power objective."}, "answer": "A", "trap": "B", "why": "Move the slide the same way the image drifted. Reversing the direction sends the image further out.", "fix": "Move the slide to the left.", "topic": "Microscope image"}, {"n": 3, "stem": "Five microscopes are used to view the same blood smear.\n(1) eyepiece 5×, objective 10×\n(2) eyepiece 10×, objective 10×\n(3) eyepiece 5×, objective 40×\n(4) eyepiece 10×, objective 40×\n(5) eyepiece 10×, objective 20×\n\nWhich microscope shows the smallest number of red blood cells, and which shows the greatest number?", "options": {"A": "(4) and (1)", "B": "(1) and (4)", "C": "(3) and (2)", "D": "(2) and (5)"}, "answer": "A", "trap": "B", "why": "A higher magnification shows fewer, larger cells. Swapping the two ends reverses the result.", "fix": "Smallest number: (4), total 400×. Greatest number: (1), total 50×.", "topic": "Magnification"}, {"n": 4, "stem": "Five microscopes are used to view the same blood smear.\n(1) eyepiece 5×, objective 10×\n(2) eyepiece 10×, objective 10×\n(3) eyepiece 5×, objective 40×\n(4) eyepiece 10×, objective 40×\n(5) eyepiece 10×, objective 20×\n\nWhich microscope gives the brightest image?", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)"}, "answer": "A", "trap": "D", "why": "A higher-power objective makes the image dimmer, not brighter.", "fix": "(1) has the lowest magnification, so the image is brightest.", "topic": "Magnification"}, {"n": 5, "stem": "Five microscopes are used to view the same blood smear.\n(1) eyepiece 5×, objective 10×\n(2) eyepiece 10×, objective 10×\n(3) eyepiece 5×, objective 40×\n(4) eyepiece 10×, objective 40×\n(5) eyepiece 10×, objective 20×\n\nWhich two microscopes show red blood cells of about the same size?", "options": {"A": "(1) and (2)", "B": "(2) and (3)", "C": "(1) and (3)", "D": "(3) and (5)"}, "answer": "D", "trap": "B", "why": "Size depends on eyepiece × objective, not on matching one lens only.", "fix": "(3) and (5) are both 200×.", "topic": "Magnification"}, {"n": 6, "stem": "Which of the following are incorrect ways to use a light microscope with a temporary mount?\n(1) Tilt the microscope.\n(2) Use a plane mirror when the lamp is dim.\n(3) Lower the body tube while looking through the eyepiece.", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "D", "trap": "C", "why": "A temporary mount should stay flat, or the liquid runs. A dim lamp needs a concave mirror, not a plane mirror. Watch from the side while lowering the tube.", "fix": "All three practices are incorrect.", "topic": "Microscope use"}, {"n": 7, "stem": "A blood smear is in focus at 400×. Which change lets you see more cells from the same slide?", "options": {"A": "Turn to a higher-power objective.", "B": "Turn to a lower-power objective.", "C": "Use a brighter lamp only.", "D": "Add more stain, without changing the objective."}, "answer": "B", "trap": "A", "why": "A higher power enlarges each cell and shows fewer of them.", "fix": "A lower-power objective gives a wider field, so more cells are seen.", "topic": "Magnification"}, {"n": 8, "stem": "Nuclei are large enough to see with a light microscope, but they are almost colourless. Which step makes them easier to see?", "options": {"A": "Use a thinner cover slip.", "B": "Increase the light intensity.", "C": "Rack the high-power objective closer to the slide.", "D": "Add a stain that colours the nuclei."}, "answer": "D", "trap": "B", "why": "More light washes out a transparent specimen. It does not create contrast.", "fix": "A stain gives the nucleus a colour that stands out from the cytoplasm.", "topic": "Staining"}, {"n": 9, "stem": "A strip of onion epidermis is mounted in iodine solution. Which structure becomes most deeply coloured?", "options": {"A": "Cell wall", "B": "Nucleus", "C": "Central vacuole", "D": "Chloroplast"}, "answer": "B", "trap": "A", "why": "Iodine is not a stain for cellulose. The thick wall is easy to see, but it is not what iodine colours most deeply.", "fix": "Iodine colours the nucleus yellow-brown. This epidermis has no chloroplasts.", "topic": "Staining"}, {"n": 10, "stem": "A root-tip squash is stained with acetocarmine. Which structure is stained deep red?", "options": {"A": "Cell wall", "B": "Chromosomes", "C": "Cell surface membrane", "D": "Chloroplasts"}, "answer": "B", "trap": "D", "why": "Root-tip cells are not photosynthetic. Acetocarmine binds DNA, not a green organelle.", "fix": "Acetocarmine stains chromosomes deep red.", "topic": "Staining"}, {"n": 11, "stem": "Which are reasons for lowering a cover slip onto a stained wet mount?\n(1) It lets more light through, so the specimen becomes transparent.\n(2) It keeps the specimen flat.\n(3) It slows drying of the specimen.\n(4) It keeps stain off the objective.", "options": {"A": "(1), (2) and (3) only", "B": "(2), (3) and (4) only", "C": "(1), (3) and (4) only", "D": "(1), (2) and (4) only"}, "answer": "B", "trap": "A", "why": "A cover slip does not make the specimen more transparent. That is not why it is used.", "fix": "It flattens the specimen, slows drying, and protects the objective.", "topic": "Slide preparation"}, {"n": 12, "stem": "A cell is to be viewed under high power. Which is the most suitable sequence?\n(1) Focus with the fine adjustment under high power.\n(2) Turn the nosepiece to the high-power objective.\n(3) Focus with the coarse adjustment under low power.\n(4) Move the slide until the cell is in the centre.\n(5) Watching from the side, lower the tube until it is just above the slide.", "options": {"A": "(5), (3), (4), (2), (1)", "B": "(3), (4), (2), (5), (1)", "C": "(2), (1), (5), (3), (4)", "D": "(5), (2), (1), (4), (3)"}, "answer": "A", "trap": "B", "why": "The tube is lowered, while you watch from the side, before you look down and focus. Lowering it again after the high-power lens is in place can hit the slide.", "fix": "Side view, coarse focus under low power, centre the cell, then high power and the fine knob.", "topic": "Microscope use"}, {"n": 13, "stem": "A light microscope cannot usefully magnify above about 1500×. Which statement explains this limit?", "options": {"A": "Glass lenses cannot be made thick enough.", "B": "A table lamp is not bright enough.", "C": "Resolution is limited by the wavelength of light.", "D": "An eyepiece cannot be made stronger than 15×."}, "answer": "C", "trap": "B", "why": "Brightness and resolution are different. A brighter lamp does not separate two closer points.", "fix": "The wavelength of light sets the resolution, so extra magnification only enlarges a blur.", "topic": "Resolution"}, {"n": 14, "stem": "An electron microscope can resolve smaller structures than a light microscope. Which is the reason?", "options": {"A": "An electron beam has a much shorter wavelength than light.", "B": "Electromagnetic lenses have a higher magnifying power than glass lenses.", "C": "Electrons travel faster than light.", "D": "Electrons make a brighter image than a lamp."}, "answer": "A", "trap": "B", "why": "A higher magnification is not the same as a higher resolution. The short wavelength is what separates finer detail.", "fix": "The shorter wavelength of the electron beam gives the higher resolution.", "topic": "Resolution"}, {"n": 15, "stem": "Which are advantages of an electron microscope over a light microscope?\n(1) Higher resolution\n(2) Higher useful magnification\n(3) Specimen preparation is simpler\n(4) It can be used with little training", "options": {"A": "(1) and (2) only", "B": "(2) and (3) only", "C": "(3) and (4) only", "D": "(1), (2) and (3) only"}, "answer": "A", "trap": "D", "why": "Preparing a specimen for an electron microscope is more demanding, not simpler.", "fix": "The advantages are resolution and useful magnification.", "topic": "Resolution"}, {"n": 16, "stem": "Which structure can be seen clearly with a school light microscope?", "options": {"A": "Ribosomes on rough endoplasmic reticulum", "B": "The double membrane of a mitochondrion", "C": "A chloroplast", "D": "A lysosome"}, "answer": "C", "trap": "B", "why": "A mitochondrion is near the limit of the light microscope. Its envelope is an electron-microscope detail.", "fix": "A chloroplast is large enough to see with a light microscope.", "topic": "LM and EM"}, {"n": 17, "stem": "Which structure can be distinguished only with an electron microscope?", "options": {"A": "A chloroplast", "B": "Rough endoplasmic reticulum", "C": "The nucleus", "D": "A large central vacuole"}, "answer": "B", "trap": "A", "why": "The chloroplast itself is visible with a light microscope. Its internal membranes are not.", "fix": "Rough endoplasmic reticulum is too small to distinguish with a light microscope.", "topic": "LM and EM"}, {"n": 18, "stem": "A student needs a three-dimensional view of the surface of a pollen grain. Another student needs to see the membranes inside a chloroplast. Which combination is correct?", "options": {"A": "Both use a light microscope.", "B": "Pollen surface: scanning electron microscope. Chloroplast membranes: transmission electron microscope.", "C": "Pollen surface: transmission electron microscope. Chloroplast membranes: scanning electron microscope.", "D": "Both use a scanning electron microscope."}, "answer": "B", "trap": "C", "why": "A scanning microscope shows surfaces. A transmission microscope sends electrons through a thin section and shows internal membranes.", "fix": "Use the scanning electron microscope for the pollen surface and the transmission electron microscope for the internal membranes.", "topic": "LM and EM"}, {"n": 19, "stem": "Which parts can change the brightness of the image?\n(1) Mirror\n(2) Iris diaphragm\n(3) Changing to a higher-power objective", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "D", "trap": "B", "why": "Switching to a higher-power objective also makes the image dimmer.", "fix": "The mirror, the iris diaphragm and the objective all affect brightness.", "topic": "Microscope use"}, {"n": 20, "stem": "Which is the better way to measure the diameter of the field of view?", "options": {"A": "A ruler marked in cm, under low power", "B": "A ruler marked in cm, under high power", "C": "A transparent ruler marked in mm, under low power", "D": "A transparent ruler marked in mm, under high power"}, "answer": "C", "trap": "D", "why": "Under high power the field is smaller than the gap between millimetre marks, so the ruler cannot be read.", "fix": "Use millimetre marks under low power, where several marks fit across the field.", "topic": "Measuring"}, {"n": 21, "stem": "The eyepiece is 10× and the objective is 10×. By how many times is the area of the image greater than the area of the object?", "options": {"A": "10 times", "B": "20 times", "C": "100 times", "D": "10 000 times"}, "answer": "D", "trap": "C", "why": "100× is the linear magnification. Area is magnified by the square of that number.", "fix": "Linear magnification is 100×, so the area is magnified 100 × 100 = 10 000 times.", "topic": "Magnification"}, {"n": 22, "stem": "The eyepiece is 15× and the objective is 40×. What is the total magnification?", "options": {"A": "55×", "B": "150×", "C": "600×", "D": "1 500×"}, "answer": "C", "trap": "A", "why": "The two magnifications are multiplied, not added.", "fix": "15 × 40 = 600×.", "topic": "Magnification"}, {"n": 23, "stem": "In a drawing, a cheek cell is 12 mm across. The actual cell is 40 μm across. What is the magnification of the drawing?", "options": {"A": "×30", "B": "×300", "C": "×3 000", "D": "×12 000"}, "answer": "B", "trap": "A", "why": "12 mm is 12 000 μm, not 1 200 μm. Using ×100 instead of ×1 000 gives ×30.", "fix": "Magnification = 12 000 μm / 40 μm = ×300.", "topic": "Measuring"}, {"n": 24, "stem": "On a photomicrograph the image of a cell is 20 mm long. The magnification is ×400. What is the actual length of the cell?", "options": {"A": "50 μm", "B": "0.05 μm", "C": "8 mm", "D": "500 μm"}, "answer": "A", "trap": "B", "why": "20 mm / 400 = 0.05 mm, which is 50 μm, not 0.05 μm.", "fix": "Actual length = 20 mm / 400 = 0.05 mm = 50 μm.", "topic": "Measuring"}, {"n": 25, "stem": "A cell is centred under low power, and the high-power objective is then clicked into place. Which adjustment should be used to make the image sharp?", "options": {"A": "The coarse adjustment knob, through a large turn", "B": "The fine adjustment knob", "C": "The eyepiece, by pulling it out", "D": "The nosepiece, by swinging back to low power"}, "answer": "B", "trap": "A", "why": "Under high power the coarse knob moves the lens too far and can hit the slide.", "fix": "Use the fine adjustment knob.", "topic": "Microscope use"}, {"n": 26, "stem": "In one cell, chloroplast 1 is sharp and chloroplast 2 is blurred. They lie at slightly different depths. How should the microscope be adjusted to sharpen chloroplast 2?", "options": {"A": "Rotate the fine adjustment knob.", "B": "Rotate the coarse adjustment knob through a large angle.", "C": "Change at once to a lower-power objective.", "D": "Add a drop of stain to the eyepiece."}, "answer": "A", "trap": "B", "why": "A large turn of the coarse knob is not how you move from one depth to another under high power.", "fix": "A small turn of the fine adjustment changes the plane of focus.", "topic": "Microscope use"}, {"n": 27, "stem": "A light micrograph shows several chloroplasts in a leaf cell. Which part of a chloroplast cannot be distinguished in that micrograph?", "options": {"A": "A granum", "B": "The outline of the chloroplast", "C": "Whether the chloroplast is in the cytoplasm", "D": "How many chloroplasts are in that cell"}, "answer": "A", "trap": "B", "why": "The outline is visible. That is why the chloroplasts can be counted. The internal stacks are not resolved.", "fix": "Grana cannot be distinguished with a light microscope.", "topic": "LM and EM"}, {"n": 28, "stem": "Which equipment can show the grana inside a chloroplast?", "options": {"A": "A hand lens", "B": "A light microscope with a 40× objective", "C": "An electron microscope", "D": "A magnifying glass and a brighter lamp"}, "answer": "C", "trap": "B", "why": "A 40× objective raises magnification. It does not resolve membranes inside the chloroplast.", "fix": "An electron microscope is needed.", "topic": "LM and EM"}, {"n": 29, "stem": "Which practices are incorrect?\n(1) Start with the lowest-power objective.\n(2) Under low power, use only the fine adjustment and never the coarse adjustment.\n(3) Under high power, look through the eyepiece while focusing downwards with the coarse adjustment.", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "C", "trap": "D", "why": "Starting with the lowest-power objective is the correct first step, not a mistake.", "fix": "(2) and (3) are incorrect. The coarse knob is used under low power, and not for focusing down under high power.", "topic": "Microscope use"}, {"n": 30, "stem": "The field of view is 0.45 mm across. A red blood cell is 7.5 μm across. How many red blood cells fit in one row across the field?", "options": {"A": "6", "B": "60", "C": "450", "D": "600"}, "answer": "B", "trap": "A", "why": "0.45 mm is 450 μm, not 45 μm. Dividing 0.45 by 7.5 without converting the unit gives 6.", "fix": "450 μm / 7.5 μm = 60.", "topic": "Measuring"}, {"n": 31, "stem": "After a wet mount is made, the objective lens becomes wet. Which step was most likely missed?", "options": {"A": "Lowering a cover slip onto the mountant", "B": "Adding a stain", "C": "Switching off the lamp", "D": "Using the coarse adjustment first"}, "answer": "A", "trap": "B", "why": "Stain colours the specimen. It does not keep liquid off the lens.", "fix": "A cover slip keeps the mountant off the objective.", "topic": "Slide preparation"}, {"n": 32, "stem": "A fresh leaf epidermis is to be mounted for viewing. Which liquid is suitable?", "options": {"A": "Dilute hydrochloric acid", "B": "Antiseptic", "C": "Dilute glycerol", "D": "Dilute sodium hydroxide"}, "answer": "C", "trap": "A", "why": "Acid is not a mountant. It damages the cells.", "fix": "Water or dilute glycerol keeps the cells in a suitable liquid.", "topic": "Slide preparation"}]}, {"id": "2", "title": "Practice 2", "subtitle": "Cell structure", "items": [{"n": 1, "stem": "Which statements about cells are incorrect?\n(1) Cells can arise from non-living matter.\n(2) The outermost boundary of every living cell is a cell wall.\n(3) Every living human cell has a nucleus.", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "D", "trap": "B", "why": "Mature red blood cells are living cells with no nucleus. Statement (3) is incorrect as well.", "fix": "All three statements are incorrect.", "topic": "Cell theory"}, {"n": 2, "stem": "Which structure is the control centre of a cell?", "options": {"A": "Nucleus", "B": "Cytoplasm", "C": "Cell wall", "D": "Chloroplast"}, "answer": "A", "trap": "B", "why": "Many reactions occur in the cytoplasm. The control centre is still the nucleus.", "fix": "The nucleus controls the activities of the cell.", "topic": "Nucleus"}, {"n": 3, "stem": "Which living human cells have no nucleus?\n(1) Bone cells\n(2) Mature red blood cells\n(3) Liver cells", "options": {"A": "(1) only", "B": "(2) only", "C": "(1) and (2) only", "D": "(2) and (3) only"}, "answer": "B", "trap": "C", "why": "Bone cells are living cells and keep their nuclei. Mature red blood cells do not.", "fix": "Only mature red blood cells, among these three, have no nucleus.", "topic": "Specialised cells"}, {"n": 4, "stem": "Which process is carried out by mitochondria, not by the nucleus?", "options": {"A": "Storing genetic information in chromosomes", "B": "Releasing energy from respiratory fuel", "C": "Making ribosomes", "D": "Controlling which proteins the cell makes"}, "answer": "B", "trap": "C", "why": "Ribosomes are made in the nucleolus, which is part of the nucleus, not in mitochondria.", "fix": "Mitochondria release energy from respiratory fuel.", "topic": "Organelles"}, {"n": 5, "stem": "Which statements about the cell wall are incorrect?\n(1) A cell wall is present in every plant cell.\n(2) A cell wall stops sucrose from passing through.\n(3) A cell wall is made mainly of cellulose.\n(4) A cell wall carries out metabolic reactions.", "options": {"A": "(1) and (2) only", "B": "(2) and (4) only", "C": "(3) and (4) only", "D": "(1), (3) and (4) only"}, "answer": "B", "trap": "A", "why": "Every plant cell has a wall. The wall is fully permeable, so it does not stop sucrose, and it is not metabolically active.", "fix": "(2) and (4) are incorrect.", "topic": "Cell wall"}, {"n": 6, "stem": "Which comparison of the cell wall and the cell membrane is incorrect?", "options": {"A": "The wall is fully permeable. The membrane is selectively permeable.", "B": "The wall is found only in plant cells. The membrane is found only in animal cells.", "C": "The wall is made mainly of carbohydrate. The membrane is made mainly of phospholipid and protein.", "D": "A plant cell in a very dilute solution is kept from bursting by its wall. An animal cell in the same solution may burst."}, "answer": "B", "trap": "A", "why": "The membrane is selectively permeable, not fully permeable. The incorrect row is the one that puts the membrane in animal cells only.", "fix": "The cell membrane is present in both plant and animal cells.", "topic": "Cell wall"}, {"n": 7, "stem": "Which structures are present in both a palisade cell and a liver cell?\n(1) Cell wall\n(2) Cell membrane\n(3) Cytoplasm\n(4) Chloroplast\n(5) Nucleus\n(6) Mitochondrion", "options": {"A": "(1), (2), (3) and (4) only", "B": "(2), (3), (4) and (5) only", "C": "(2), (3), (5) and (6) only", "D": "(1), (3), (4) and (6) only"}, "answer": "C", "trap": "B", "why": "A liver cell has no chloroplast. Chloroplast is not a structure shared by both cells.", "fix": "Both have a cell membrane, cytoplasm, a nucleus and mitochondria.", "topic": "Plant and animal cells"}, {"n": 8, "stem": "Which comparison of an animal cell and a green leaf cell is incorrect?", "options": {"A": "The animal cell has no chloroplast. The leaf cell has chloroplasts.", "B": "The animal cell has no cell wall. The leaf cell has a cell wall.", "C": "The animal cell stores glycogen. The leaf cell does not store glycogen.", "D": "The animal cell has mitochondria. The leaf cell has no mitochondria."}, "answer": "D", "trap": "C", "why": "Leaf cells store starch, not glycogen, so that comparison is correct. Both cells have mitochondria.", "fix": "A green leaf cell has mitochondria as well as chloroplasts.", "topic": "Plant and animal cells"}, {"n": 9, "stem": "Which is an incorrect difference between a spongy mesophyll cell and a root hair cell?", "options": {"A": "Gas exchange occurs at the surface of the mesophyll cell, but it cannot occur at the surface of the root hair cell.", "B": "The mesophyll cell has chloroplasts. The root hair cell does not.", "C": "The mesophyll cell has an irregular shape. The root hair cell has a long projection.", "D": "The mesophyll cell makes food. The root hair cell does not."}, "answer": "A", "trap": "B", "why": "Root hair cells really do lack chloroplasts. They do exchange gases at their surface.", "fix": "Both cells exchange gases. Statement A is not a real difference.", "topic": "Specialised cells"}, {"n": 10, "stem": "Chloroplasts are present in", "options": {"A": "guard cells and ordinary epidermal cells.", "B": "mesophyll cells and ordinary epidermal cells.", "C": "guard cells and mesophyll cells.", "D": "guard cells, mesophyll cells and ordinary epidermal cells."}, "answer": "C", "trap": "A", "why": "Guard cells have chloroplasts. The ordinary epidermal cells around them do not.", "fix": "Chloroplasts are in guard cells and mesophyll cells, not in ordinary epidermis.", "topic": "Specialised cells"}, {"n": 11, "stem": "Which cells produce carbon dioxide?\n(1) An epidermal cell of a leaf\n(2) A root hair cell\n(3) A xylem vessel", "options": {"A": "(1) only", "B": "(2) only", "C": "(1) and (2) only", "D": "(2) and (3) only"}, "answer": "C", "trap": "D", "why": "A xylem vessel is dead. It has no cytoplasm, so it does not respire.", "fix": "The epidermal cell and the root hair cell are living and respire. The xylem vessel does not.", "topic": "Specialised cells"}, {"n": 12, "stem": "Which structure is absent from a root hair cell?", "options": {"A": "Chloroplasts", "B": "Chromosomes", "C": "A vacuole", "D": "A cell membrane"}, "answer": "A", "trap": "B", "why": "A root hair cell is living and has a nucleus, so it has chromosomes.", "fix": "Root hair cells have no chloroplasts.", "topic": "Specialised cells"}, {"n": 13, "stem": "Which structure is present in every plant cell but absent from animal cells?", "options": {"A": "Nucleus", "B": "Chloroplast", "C": "Large permanent vacuole", "D": "Cell wall"}, "answer": "D", "trap": "B", "why": "Root cells and epidermal cells are plant cells without chloroplasts. Every plant cell has a wall.", "fix": "The cell wall is the structure found in all plant cells and not in animal cells.", "topic": "Cell wall"}, {"n": 14, "stem": "Which are shared by a mature red blood cell and a neurone?\n(1) DNA\n(2) Cell membrane\n(3) A large central vacuole\n(4) Nucleus", "options": {"A": "(2) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(3) and (4) only"}, "answer": "A", "trap": "B", "why": "A mature red blood cell has no nucleus, so it has no DNA.", "fix": "They share a cell membrane only.", "topic": "Specialised cells"}, {"n": 15, "stem": "Which are true of both a root hair cell and a human red blood cell?\n(1) It has a cell membrane.\n(2) It has chromosomes.\n(3) It has no chloroplasts.\n(4) It has no cell wall.", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(1) and (4) only", "D": "(2) and (3) only"}, "answer": "B", "trap": "C", "why": "A root hair cell has a cell wall. A red blood cell does not. 'No cell wall' is not true of both.", "fix": "Both have a cell membrane and neither has chloroplasts.", "topic": "Plant and animal cells"}, {"n": 16, "stem": "An onion epidermal cell differs from an Amoeba in having\n(1) chloroplasts.\n(2) a large central vacuole.\n(3) a cell wall.", "options": {"A": "(1) only", "B": "(3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "C", "trap": "D", "why": "Onion epidermis is not green. It has no chloroplasts.", "fix": "It has a large vacuole and a cell wall.", "topic": "Plant and animal cells"}, {"n": 17, "stem": "Which structure is absent from a mature xylem vessel?", "options": {"A": "Cell wall", "B": "Nucleus", "C": "Lignin", "D": "Pits"}, "answer": "B", "trap": "A", "why": "The vessel is a thickened wall. The living contents, including the nucleus, have been lost.", "fix": "A mature xylem vessel has no nucleus.", "topic": "Specialised cells"}, {"n": 18, "stem": "Which cell contains the greatest amount of DNA?", "options": {"A": "A pollen grain", "B": "An egg cell", "C": "A mature xylem vessel", "D": "A mesophyll cell"}, "answer": "D", "trap": "A", "why": "A pollen grain is haploid, and a mature xylem vessel has no nucleus. A mesophyll cell is a living diploid cell.", "fix": "The mesophyll cell has the most DNA.", "topic": "Nucleus"}, {"n": 19, "stem": "Which structure is present in all plant cells and all animal cells?", "options": {"A": "A nucleus", "B": "A cell membrane", "C": "A nucleus and a cell membrane", "D": "A nucleus, a cell membrane and a large vacuole"}, "answer": "B", "trap": "C", "why": "Mature red blood cells have a cell membrane but no nucleus.", "fix": "Every living cell has a cell membrane. Not every living cell has a nucleus.", "topic": "Cell membrane"}, {"n": 20, "stem": "Which list is in ascending order of complexity?", "options": {"A": "Cell, tissue, organ, organ system, organism", "B": "Organism, organ system, organ, tissue, cell", "C": "Cell, organ, organ system, tissue, organism", "D": "Tissue, cell, organ, organism, organ system"}, "answer": "A", "trap": "C", "why": "A tissue is a group of cells. It comes before an organ, not after an organ system.", "fix": "The order is cell, tissue, organ, organ system, organism.", "topic": "Levels of organisation"}, {"n": 21, "stem": "Which statements about cheek cells are incorrect?\n(1) They have no cell wall.\n(2) They are gametes.\n(3) They move about like an Amoeba.\n(4) They are diploid.", "options": {"A": "(1) only", "B": "(3) only", "C": "(1) and (4) only", "D": "(2) and (3) only"}, "answer": "D", "trap": "B", "why": "Cheek cells are body cells, not gametes. They also do not crawl like an Amoeba.", "fix": "(2) and (3) are incorrect statements.", "topic": "Specialised cells"}, {"n": 22, "stem": "These cells are assumed to be the same size. Which has the largest volume of cytoplasm?\n(1) A mature ovum\n(2) A mature red blood cell\n(3) A neurone\n(4) A mucus-secreting cell", "options": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)"}, "answer": "B", "trap": "A", "why": "An ovum is usually the largest of these cells, but the sizes have been set equal. The red blood cell has no nucleus, so more of its volume is cytoplasm.", "fix": "The mature red blood cell.", "topic": "Specialised cells"}, {"n": 23, "stem": "Which two cells have the same number of chromosomes?\n(1) A mature ovum\n(2) A mature red blood cell\n(3) A neurone\n(4) A mucus-secreting cell", "options": {"A": "(1) and (2)", "B": "(1) and (3)", "C": "(2) and (4)", "D": "(3) and (4)"}, "answer": "D", "trap": "B", "why": "An ovum is haploid. A neurone is diploid. A mature red blood cell has no chromosomes.", "fix": "The neurone and the mucus-secreting cell are both diploid body cells.", "topic": "Nucleus"}, {"n": 24, "stem": "Which structures support a young leaf cell?\n(1) Cell wall\n(2) Nucleus\n(3) A vacuole full of cell sap", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(1) and (3) only", "D": "(2) and (3) only"}, "answer": "C", "trap": "A", "why": "The wall supplies support, and so does turgor from the vacuole. The nucleus does not hold the cell up.", "fix": "The cell wall and the turgid vacuole support the cell.", "topic": "Cell wall"}, {"n": 25, "stem": "Which are functions of the cell membrane?\n(1) It can allow glucose to enter the cell.\n(2) It stops starch leaving the cell.\n(3) It stops all movement of water into or out of the cell.", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "A", "trap": "D", "why": "Water can cross the membrane. The membrane does not keep every water molecule inside.", "fix": "Glucose can enter and starch cannot leave. Water is not locked in.", "topic": "Cell membrane"}, {"n": 26, "stem": "Which statements about the cell wall are correct?\n(1) It supports the cell.\n(2) It is fully permeable.\n(3) It controls which substances enter and leave the cell.", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "A", "trap": "B", "why": "Control of entry and exit is the job of the cell membrane, not the cell wall.", "fix": "The wall supports the cell and is fully permeable.", "topic": "Cell wall"}, {"n": 27, "stem": "Which structures are especially abundant in a cell that secretes an enzyme?", "options": {"A": "Chloroplasts and a large vacuole", "B": "Rough endoplasmic reticulum and Golgi apparatus", "C": "Smooth endoplasmic reticulum and a cell wall", "D": "Cilia and chloroplasts"}, "answer": "B", "trap": "C", "why": "Smooth endoplasmic reticulum makes lipids. A secreted enzyme is a protein, made on rough endoplasmic reticulum and packaged by the Golgi apparatus.", "fix": "Rough endoplasmic reticulum and Golgi apparatus.", "topic": "Protein secretion"}, {"n": 28, "stem": "Which description fits a palisade cell?", "options": {"A": "It has many chloroplasts and also has mitochondria.", "B": "It has many chloroplasts and no mitochondria.", "C": "It has no chloroplasts and many cilia.", "D": "It has a cell wall and no cell membrane."}, "answer": "A", "trap": "B", "why": "Photosynthesis does not replace respiration. A palisade cell has both chloroplasts and mitochondria.", "fix": "A palisade cell has many chloroplasts and also has mitochondria.", "topic": "Organelles"}, {"n": 29, "stem": "A cell that secretes protein develops more rough endoplasmic reticulum and more mitochondria. How do these two structures work together?", "options": {"A": "Mitochondria make the protein. Rough endoplasmic reticulum supplies the energy.", "B": "Rough endoplasmic reticulum makes the protein. Mitochondria supply ATP for making and moving it.", "C": "Both structures copy DNA and turn it directly into protein.", "D": "Rough endoplasmic reticulum digests the protein. Mitochondria store the products."}, "answer": "B", "trap": "A", "why": "The two jobs are often swapped. Protein is made on the rough endoplasmic reticulum. The energy comes from the mitochondria.", "fix": "Rough endoplasmic reticulum synthesises the protein. Mitochondria supply the ATP.", "topic": "Protein secretion"}, {"n": 30, "stem": "Proteins made on free ribosomes in the cytosol are most likely to be", "options": {"A": "antibodies released into the blood.", "B": "insulin secreted by the pancreas.", "C": "enzymes that work in the cytosol.", "D": "receptors fixed in the cell surface membrane."}, "answer": "C", "trap": "B", "why": "Insulin is secreted, so it is made on ribosomes attached to rough endoplasmic reticulum, not on free ribosomes.", "fix": "Free ribosomes make proteins that stay and work in the cytosol.", "topic": "Protein secretion"}, {"n": 31, "stem": "Which cell has the most rough endoplasmic reticulum?", "options": {"A": "A ciliated epithelial cell of the trachea", "B": "A cell that secretes protease into the stomach", "C": "A mature red blood cell", "D": "A mature xylem vessel"}, "answer": "B", "trap": "A", "why": "Cilia do not make a cell a protein-secreting cell. Protease is a protein that is exported, so the secretory cell has abundant rough endoplasmic reticulum.", "fix": "The stomach cell that secretes protease.", "topic": "Protein secretion"}, {"n": 32, "stem": "Which set of structures is found in a prokaryotic cell?", "options": {"A": "Cell wall, ribosome, cell membrane", "B": "Ribosome, cell membrane, chloroplast", "C": "Cell wall, cell membrane, mitochondrion", "D": "Cell membrane, chloroplast, mitochondrion"}, "answer": "A", "trap": "C", "why": "A prokaryotic cell has a wall, but it has no mitochondrion. Respiration is not housed in that organelle.", "fix": "Cell wall, ribosome and cell membrane.", "topic": "Prokaryotes"}]}, {"id": "3", "title": "Practice 3", "subtitle": "Membranes and organelles", "items": [{"n": 1, "stem": "Which statement about the cell membrane is correct?", "options": {"A": "It is fully permeable.", "B": "It is selectively permeable.", "C": "It is a complete barrier that stops every virus.", "D": "It allows only lipid-soluble substances to enter."}, "answer": "B", "trap": "D", "why": "Small polar molecules and some ions cross through proteins. The membrane is not limited to lipid-soluble substances.", "fix": "The cell membrane is selectively permeable.", "topic": "Cell membrane"}, {"n": 2, "stem": "Which statements about the cell membrane are incorrect?\n(1) It is fully permeable to all substances.\n(2) Both surfaces of the phospholipid bilayer are covered by a continuous sheet of protein, with no gaps.\n(3) Channel proteins are the structures that carry out active transport.", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(1) and (3) only", "D": "(1), (2) and (3)"}, "answer": "D", "trap": "C", "why": "Proteins are scattered in the bilayer. They do not form a continuous coat. Channel proteins also do not carry out active transport.", "fix": "All three statements are incorrect.", "topic": "Fluid mosaic"}, {"n": 3, "stem": "How are phospholipids arranged in the cell membrane?", "options": {"A": "Hydrophilic heads face the watery fluids on both sides. Hydrophobic tails face inward.", "B": "Hydrophilic heads face inward. Hydrophobic tails face the watery fluids.", "C": "Both the heads and the tails are hydrophobic.", "D": "Proteins form the bilayer. Phospholipids lie only on the outer surface."}, "answer": "A", "trap": "B", "why": "The heads are the water-loving parts, so they face the aqueous fluids, not the middle of the membrane.", "fix": "Heads face outwards. Tails face inwards.", "topic": "Fluid mosaic"}, {"n": 4, "stem": "Vitamin C is water-soluble. Vitamin D is lipid-soluble. Which routes do they use to cross the cell membrane?", "options": {"A": "Vitamin C through a membrane protein. Vitamin D through the phospholipid bilayer.", "B": "Both through the phospholipid bilayer only.", "C": "Both through channel proteins only.", "D": "Vitamin C through the phospholipid bilayer. Vitamin D through a membrane protein."}, "answer": "A", "trap": "D", "why": "Solubility decides the route. The water-soluble vitamin uses a protein. The lipid-soluble vitamin passes between the tails.", "fix": "Vitamin C uses a protein. Vitamin D crosses the bilayer.", "topic": "Fluid mosaic"}, {"n": 5, "stem": "Glucose is absorbed into a cell of the small intestine against its concentration gradient. Which structure does this?", "options": {"A": "A channel protein, which does not use ATP", "B": "A carrier protein that uses energy", "C": "Cholesterol", "D": "The hydrophobic tails, because glucose dissolves in lipid"}, "answer": "B", "trap": "A", "why": "A channel lets substances move down a gradient. It does not carry out active transport.", "fix": "A carrier protein uses energy to move glucose against its gradient.", "topic": "Fluid mosaic"}, {"n": 6, "stem": "What is the role of cholesterol in the cell membrane?", "options": {"A": "It catalyses electron transport during photosynthesis.", "B": "It stabilises the fluidity of the membrane.", "C": "It is the main route for active transport.", "D": "It forms the hydrophobic barrier on its own."}, "answer": "B", "trap": "A", "why": "Electron transport in photosynthesis belongs to the chloroplast, not to cholesterol in the cell membrane.", "fix": "Cholesterol stabilises membrane fluidity.", "topic": "Fluid mosaic"}, {"n": 7, "stem": "What is the importance of the fluid nature of the cell membrane?", "options": {"A": "The membrane can change shape and can fuse with vesicles.", "B": "The membrane becomes freely permeable.", "C": "Proteins are no longer needed.", "D": "Phospholipids stop moving."}, "answer": "A", "trap": "B", "why": "Fluidity allows shape change and vesicle fusion. It does not make the membrane freely permeable.", "fix": "The membrane can change shape and fuse with vesicles.", "topic": "Fluid mosaic"}, {"n": 8, "stem": "Which statements describe the mosaic nature of the cell membrane?\n(1) Proteins that cross the bilayer let some polar molecules through.\n(2) Some proteins act as receptors.\n(3) The proteins, not the fatty acid tails, are the main barrier to water-soluble substances.", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "B", "trap": "D", "why": "The fatty acid tails are the barrier to water-soluble substances. Proteins provide routes through that barrier.", "fix": "(1) and (2) fit the mosaic of proteins. (3) does not.", "topic": "Fluid mosaic"}, {"n": 9, "stem": "Which part of the cell membrane stops glucose diffusing straight through the bilayer?", "options": {"A": "The phosphate heads", "B": "The fatty acid tails", "C": "Channel proteins, which repel glucose", "D": "Ribosomes on the membrane surface"}, "answer": "B", "trap": "A", "why": "The heads face the water. The barrier to a water-soluble molecule is the hydrophobic tail region.", "fix": "The fatty acid tails stop glucose crossing the bilayer itself.", "topic": "Fluid mosaic"}, {"n": 10, "stem": "Identical beetroot cylinders are placed in equal volumes of alcohol at different concentrations. The bathing solution that becomes the deepest red is the one in which the membrane is most damaged. Which explanation fits?", "options": {"A": "The highest alcohol concentration dissolves membrane phospholipids, so pigment leaks out.", "B": "The highest alcohol concentration has the lowest water potential, so pigment leaves by osmosis.", "C": "The lowest alcohol concentration makes the cells burst by osmosis.", "D": "The pigment is more soluble in the most dilute alcohol, so that tube is deepest red."}, "answer": "A", "trap": "B", "why": "Pigment leaves because the membrane is damaged, not because the pigment itself is drawn out by osmosis.", "fix": "Alcohol dissolves phospholipids. The highest concentration damages the membrane most.", "topic": "Cell membrane"}, {"n": 11, "stem": "Which events depend on proteins in the cell membrane?\n(1) Transmission of a nerve impulse along a neurone\n(2) Absorption of glucose in the small intestine\n(3) Transport of oxygen by haemoglobin inside a red blood cell", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "A", "trap": "D", "why": "Haemoglobin is a protein in the cytoplasm. It is not a membrane protein.", "fix": "Ion channels and glucose carriers are membrane proteins. Haemoglobin is not.", "topic": "Cell membrane"}, {"n": 12, "stem": "A water-soluble red dye enters non-viable sperm but not viable sperm. Which structure is being tested?", "options": {"A": "Nucleus", "B": "Cytoplasm", "C": "Cell membrane", "D": "Ribosome"}, "answer": "C", "trap": "A", "why": "The dye is testing whether a barrier is still intact. That barrier is the cell membrane, not the nucleus.", "fix": "An intact cell membrane keeps the dye out.", "topic": "Cell membrane"}, {"n": 13, "stem": "Under high power, a sperm is seen in the lower-right of the field. In which direction should the slide be moved to bring the image to the centre?", "options": {"A": "Right and downward", "B": "Right and upward", "C": "Left and downward", "D": "Left and upward"}, "answer": "A", "trap": "D", "why": "Move the slide towards the side where the image is sitting. Moving the opposite way, because the image is inverted, pushes it further out.", "fix": "Move the slide right and downward.", "topic": "Microscope image"}, {"n": 14, "stem": "Which list arranges the structures from smallest to largest?", "options": {"A": "Nucleus, mitochondrion, chloroplast, ribosome", "B": "Nucleus, chloroplast, mitochondrion, ribosome", "C": "Ribosome, mitochondrion, chloroplast, nucleus", "D": "Chloroplast, mitochondrion, nucleus, ribosome"}, "answer": "C", "trap": "A", "why": "Reading the sizes from the largest diagram label backwards puts the nucleus first. A ribosome is the smallest of the four.", "fix": "Ribosome, mitochondrion, chloroplast, nucleus.", "topic": "Organelles"}, {"n": 15, "stem": "Which pairing of organelle and function is incorrect?", "options": {"A": "Chloroplast — synthesis of organic food", "B": "Mitochondrion — oxidation of respiratory fuel", "C": "Rough endoplasmic reticulum — digestion of particles taken in by phagocytosis", "D": "Nucleolus — production of ribosomes"}, "answer": "C", "trap": "D", "why": "The nucleolus does make ribosomes. Digestion of material taken in by phagocytosis is not the job of rough endoplasmic reticulum.", "fix": "Rough endoplasmic reticulum synthesises protein. It does not digest phagocytosed particles.", "topic": "Organelles"}, {"n": 16, "stem": "Organelle X is a mitochondrion. Organelle Y is a chloroplast. Which statements are correct?\n(1) X releases energy from food. Y builds food using light.\n(2) X is bounded by a double membrane. Y is bounded by a single membrane.\n(3) Folds of the inner membrane of X increase the surface for ATP production. Membranes inside Y increase the surface for absorbing light.\n(4) Y is present in every plant cell.", "options": {"A": "(1) and (2) only", "B": "(2) and (4) only", "C": "(3) and (4) only", "D": "(1) and (3) only"}, "answer": "D", "trap": "C", "why": "A chloroplast has a double membrane, and it is not present in every plant cell. Root cells are the usual counter-example.", "fix": "(1) and (3) are correct.", "topic": "Organelles"}, {"n": 17, "stem": "Which substances are found in both mitochondria and chloroplasts?\n(1) Enzymes\n(2) DNA\n(3) A cell wall", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "B", "trap": "A", "why": "Both organelles contain DNA as well as enzymes. Neither has a cell wall.", "fix": "Enzymes and DNA.", "topic": "Organelles"}, {"n": 18, "stem": "Which structures contain DNA?\n(1) Nucleus\n(2) Chloroplast\n(3) Mitochondrion\n(4) Rough endoplasmic reticulum", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(1), (2) and (3) only", "D": "(1), (2), (3) and (4)"}, "answer": "C", "trap": "D", "why": "Ribosomes on rough endoplasmic reticulum are made of RNA and protein. That does not put DNA in the rough endoplasmic reticulum.", "fix": "DNA is in the nucleus, chloroplasts and mitochondria.", "topic": "Nucleus"}, {"n": 19, "stem": "Which structures contain RNA?\n(1) Nucleus\n(2) Ribosome\n(3) Rough endoplasmic reticulum\n(4) Nucleolus", "options": {"A": "(1) and (2) only", "B": "(2) and (3) only", "C": "(1), (2) and (3) only", "D": "(1), (2), (3) and (4)"}, "answer": "D", "trap": "C", "why": "The nucleolus is where ribosomal RNA is assembled into ribosomes. It contains RNA.", "fix": "All four contain RNA.", "topic": "Nucleus"}, {"n": 20, "stem": "Which structure has the highest concentration of RNA?", "options": {"A": "Smooth endoplasmic reticulum", "B": "Mitochondrion", "C": "Chromosome", "D": "Nucleolus"}, "answer": "D", "trap": "C", "why": "A chromosome is mainly DNA and protein. The dense RNA is in the nucleolus.", "fix": "The nucleolus.", "topic": "Nucleus"}, {"n": 21, "stem": "Which is the route of a protein that is secreted from a cell?", "options": {"A": "Rough endoplasmic reticulum → Golgi apparatus → cell surface membrane", "B": "Smooth endoplasmic reticulum → rough endoplasmic reticulum → cell surface membrane", "C": "Cell surface membrane → rough endoplasmic reticulum → Golgi apparatus", "D": "Rough endoplasmic reticulum → smooth endoplasmic reticulum → cell surface membrane"}, "answer": "A", "trap": "D", "why": "Skipping the Golgi apparatus, or sending the protein through smooth endoplasmic reticulum, leaves out the organelle that modifies and packages it.", "fix": "Rough endoplasmic reticulum, then Golgi apparatus, then the cell surface.", "topic": "Protein secretion"}, {"n": 22, "stem": "Which pairing is correct?", "options": {"A": "Rough endoplasmic reticulum makes insulin. Smooth endoplasmic reticulum makes a steroid hormone.", "B": "Rough endoplasmic reticulum makes a steroid hormone. Smooth endoplasmic reticulum makes insulin.", "C": "Rough endoplasmic reticulum makes glycogen. Smooth endoplasmic reticulum makes starch.", "D": "Rough endoplasmic reticulum makes DNA. Smooth endoplasmic reticulum makes cellulose."}, "answer": "A", "trap": "B", "why": "Insulin is a protein, so it is made on rough endoplasmic reticulum. A steroid is a lipid, made on smooth endoplasmic reticulum.", "fix": "Rough endoplasmic reticulum: insulin. Smooth endoplasmic reticulum: steroid hormone.", "topic": "Protein secretion"}, {"n": 23, "stem": "On which structure can phagocytosis take place?", "options": {"A": "Mitochondrion", "B": "Chloroplast", "C": "Endoplasmic reticulum", "D": "Cell surface membrane"}, "answer": "D", "trap": "C", "why": "Phagocytosis is an infolding of the cell surface. Internal membranes do not engulf particles from outside the cell.", "fix": "The cell surface membrane.", "topic": "Cell membrane"}, {"n": 24, "stem": "In a green plant cell, where do aerobic respiration and photosynthesis take place?", "options": {"A": "Aerobic respiration in mitochondria. Photosynthesis in chloroplasts.", "B": "Aerobic respiration in chloroplasts. Photosynthesis in mitochondria.", "C": "Both in the nucleus.", "D": "Aerobic respiration on ribosomes. Photosynthesis in the cell wall."}, "answer": "A", "trap": "B", "why": "The two organelles are often swapped because both are involved in energy conversion.", "fix": "Mitochondria respire. Chloroplasts photosynthesise.", "topic": "Organelles"}, {"n": 25, "stem": "Which substances are found inside a mitochondrion?\n(1) ATP\n(2) Enzymes\n(3) Glycogen", "options": {"A": "(1) only", "B": "(1) and (2) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "B", "trap": "D", "why": "Glycogen is a stored fuel in the cytoplasm. It is not kept inside the mitochondrion. ATP and respiratory enzymes are.", "fix": "ATP and enzymes. Not glycogen.", "topic": "Organelles"}, {"n": 26, "stem": "Which organelle is bounded by a double membrane whose inner membrane is folded to increase surface area?", "options": {"A": "Nucleus", "B": "Mitochondrion", "C": "Ribosome", "D": "Golgi apparatus"}, "answer": "B", "trap": "A", "why": "The nucleus has a double membrane, but that membrane is not folded into cristae. The folds are the clue for the mitochondrion.", "fix": "The mitochondrion.", "topic": "Organelles"}, {"n": 27, "stem": "Which description of the Golgi apparatus and rough endoplasmic reticulum is correct?", "options": {"A": "The Golgi apparatus modifies and packages proteins. Rough endoplasmic reticulum synthesises them.", "B": "The Golgi apparatus synthesises proteins. Rough endoplasmic reticulum only packages them.", "C": "Both synthesise lipids and neither handles protein.", "D": "The Golgi apparatus makes ribosomes."}, "answer": "A", "trap": "B", "why": "Synthesis and packaging are neighbouring steps. The protein is made first on rough endoplasmic reticulum.", "fix": "Rough endoplasmic reticulum synthesises the protein. The Golgi apparatus modifies and packages it.", "topic": "Protein secretion"}, {"n": 28, "stem": "Which compounds are found in both eukaryotic and prokaryotic cells?\n(1) DNA\n(2) Cellulose\n(3) Phospholipid", "options": {"A": "(1) and (2) only", "B": "(1) and (3) only", "C": "(2) and (3) only", "D": "(1), (2) and (3)"}, "answer": "B", "trap": "A", "why": "Cellulose is the plant cell-wall material. It is not a compound shared with prokaryotic cells.", "fix": "DNA and phospholipid.", "topic": "Prokaryotes"}, {"n": 29, "stem": "Which structure is not surrounded by a membrane?", "options": {"A": "Nucleus", "B": "Vacuole", "C": "Mitochondrion", "D": "Ribosome"}, "answer": "D", "trap": "B", "why": "A vacuole looks like an empty space, but it is bounded by a membrane. A ribosome is not.", "fix": "The ribosome.", "topic": "Organelles"}, {"n": 30, "stem": "Which organisms are prokaryotes?\n(1) Fungi\n(2) Bacteria\n(3) Mosses\n(4) Cyanobacteria", "options": {"A": "(1) and (2) only", "B": "(2) and (3) only", "C": "(2) and (4) only", "D": "(1) and (4) only"}, "answer": "C", "trap": "A", "why": "Fungi have nuclei and membrane-bound organelles. They are not prokaryotes.", "fix": "Bacteria and cyanobacteria.", "topic": "Prokaryotes"}, {"n": 31, "stem": "Which structures occur in a prokaryotic cell?\n(1) Mitochondrion\n(2) Ribosome\n(3) Nuclear membrane\n(4) Cytoplasm\n(5) DNA", "options": {"A": "(1), (2) and (3) only", "B": "(2), (4) and (5) only", "C": "(1), (3) and (5) only", "D": "(2), (3) and (4) only"}, "answer": "B", "trap": "D", "why": "A nuclear membrane is a eukaryotic feature. Prokaryotic DNA lies in the cytoplasm.", "fix": "Ribosome, cytoplasm and DNA.", "topic": "Prokaryotes"}, {"n": 32, "stem": "The table shows the relative amounts of three structures. '+' means present in a larger amount.\n\nCell | Mitochondria | Rough endoplasmic reticulum | Vesicles\nW | +++ | + | +\nX | +++ | +++ | +++\nY | + | + | +\nZ | + | +++ | +\n\nWhich cell is most likely to secrete an enzyme?", "options": {"A": "W", "B": "X", "C": "Y", "D": "Z"}, "answer": "B", "trap": "A", "why": "Many mitochondria show a high energy demand. Secretion also needs a large amount of rough endoplasmic reticulum and many vesicles.", "fix": "Cell X has all three in large amounts.", "topic": "Protein secretion"}]}]</script>
<script>
const BANK = JSON.parse(document.getElementById("bank").textContent);
const app = document.getElementById("app");
const KEY = "cell-org-practice-v1";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch (e) { return []; }
}
function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

let state = { name:"", cls:"", session:null, i:0, picks:[] };

function el(html) { app.innerHTML = html; }

function home() {
  const attempts = load().filter(a => a.name === state.name && a.cls === state.cls);
  const past = attempts.length ? attempts.slice().reverse().map(a =>
    `<tr><td>${a.when}</td><td>${a.title}</td><td>${a.score}/${a.total}</td></tr>`
  ).join("") : "";
  el(`
    <section class="card">
      <div class="row">
        <div><label for="name">Name</label><input id="name" type="text" autocomplete="name" value="${esc(state.name)}"></div>
        <div><label for="cls">Class</label><input id="cls" type="text" value="${esc(state.cls)}"></div>
      </div>
    </section>
    <section class="sessions">
      ${BANK.map(s => `<button class="session" data-id="${s.id}"><strong>${esc(s.title)}</strong><span class="sub">${esc(s.subtitle)}</span><span class="small">${s.items.length} questions</span></button>`).join("")}
    </section>
    ${past ? `<section class="card"><h2>Your saved results on this device</h2><table>${past}</table><p class="small">Results stay in this browser. They are not sent anywhere.</p></section>` : `<p class="small">Your result stays in this browser. It is not sent anywhere.</p>`}
  `);
  document.getElementById("name").addEventListener("input", e => state.name = e.target.value.trim());
  document.getElementById("cls").addEventListener("input", e => state.cls = e.target.value.trim());
  app.querySelectorAll(".session").forEach(b => b.addEventListener("click", () => start(b.dataset.id)));
}

function start(id) {
  const nameEl = document.getElementById("name");
  const clsEl = document.getElementById("cls");
  if (nameEl) state.name = nameEl.value.trim();
  if (clsEl) state.cls = clsEl.value.trim();
  if (!state.name || !state.cls) { alert("Enter your name and class first."); return; }
  state.session = BANK.find(s => s.id === id);
  state.i = 0;
  state.picks = state.session.items.map(() => "");
  renderQ();
}

function renderQ() {
  const s = state.session;
  const it = s.items[state.i];
  const pct = Math.round((state.i) / s.items.length * 100);
  el(`
    <p class="small">${esc(state.name)} · ${esc(state.cls)} · ${esc(s.title)} · ${esc(s.subtitle)}</p>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <section class="card">
      <p class="small">Question ${state.i + 1} of ${s.items.length}</p>
      <p class="stem"></p>
      <div class="opts">
        ${["A","B","C","D"].map(k => `<button class="choice ${state.picks[state.i]===k?"on":""}" data-k="${k}"><strong>${k}.</strong> ${esc(it.options[k])}</button>`).join("")}
      </div>
      <div class="nav">
        <button class="ghost" id="back" ${state.i===0?"disabled":""}>Back</button>
        <button class="primary" id="next">${state.i === s.items.length - 1 ? "Submit" : "Next"}</button>
      </div>
    </section>
  `);
  app.querySelector(".stem").textContent = it.stem;
  app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    state.picks[state.i] = b.dataset.k;
    renderQ();
  }));
  document.getElementById("back").addEventListener("click", () => { state.i--; renderQ(); });
  document.getElementById("next").addEventListener("click", () => {
    if (!state.picks[state.i]) { alert("Choose an answer."); return; }
    if (state.i === s.items.length - 1) finish();
    else { state.i++; renderQ(); }
  });
}

function finish() {
  const s = state.session;
  let score = 0;
  const misses = [];
  const byTopic = {};
  s.items.forEach((it, idx) => {
    const pick = state.picks[idx];
    const right = pick === it.answer;
    if (right) score++;
    if (!byTopic[it.topic]) byTopic[it.topic] = { right:0, n:0 };
    byTopic[it.topic].n++;
    if (right) byTopic[it.topic].right++;
    if (!right) {
      misses.push({
        n: it.n, pick, answer: it.answer,
        stem: it.stem, chosen: it.options[pick], correct: it.options[it.answer],
        note: pick === it.trap ? it.why : it.fix,
        usual: pick === it.trap
      });
    }
  });
  const when = new Date().toLocaleString();
  const rec = { name: state.name, cls: state.cls, title: s.title + " — " + s.subtitle, when, score, total: s.items.length };
  const all = load(); all.push(rec); save(all);
  const weak = Object.entries(byTopic)
    .map(([t, v]) => ({ t, lost: v.n - v.right, n: v.n, right: v.right }))
    .sort((a, b) => b.lost - a.lost || a.right / a.n - b.right / b.n);
  const weakLine = weak.filter(w => w.lost > 0).slice(0, 3)
    .map(w => `${w.t} (${w.right}/${w.n})`).join("; ");
  el(`
    <section class="card" id="report">
      <p class="small">${esc(state.name)} · Class ${esc(state.cls)} · ${esc(s.title)} · ${esc(s.subtitle)}</p>
      <p class="score ${score >= s.items.length * 0.7 ? "ok" : "bad"}">${score} / ${s.items.length}</p>
      <p>${Math.round(score / s.items.length * 100)}%</p>
      <h2>Personal report</h2>
      <p>${misses.length === 0
        ? "Every item in this practice was correct. The next practice will show whether the same ideas hold when the question is asked in another way."
        : "The marks were lost mainly in: <strong>" + esc(weakLine || "mixed items") + "</strong>."}</p>
      <p class="small">Where you chose the usual slip, the note explains that idea. Otherwise the note states the correct idea.</p>
      ${misses.map(m => `
        <div class="miss">
          <p><strong>Question ${m.n}.</strong> You chose ${m.pick}. The answer is ${m.answer}.</p>
          <p class="stem"></p>
          <p><strong>Your choice.</strong> ${esc(m.chosen)}</p>
          <p><strong>Answer.</strong> ${esc(m.correct)}</p>
          <p>${esc(m.note)}</p>
        </div>`).join("") || "<p>No incorrect answers in this practice.</p>"}
    </section>
    <p class="noprint"><button class="ghost" id="print">Print report</button> <button class="primary" id="again">Back to practices</button></p>
  `);
  app.querySelectorAll(".miss").forEach((box, i) => {
    const stem = box.querySelector(".stem");
    if (stem) stem.textContent = misses[i].stem;
  });
  document.getElementById("print").addEventListener("click", () => window.print());
  document.getElementById("again").addEventListener("click", home);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
home();
</script>
</body>
</html>
