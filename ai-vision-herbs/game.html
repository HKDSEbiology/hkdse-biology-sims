function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function others(h){ return HERBS.filter(x=>x.n!==h.n); }
function fact(h){ return h.c+"；"+h.t; }

function optionsFor(h, key){
  const opts=[{text:h[key], ok:true}];
  for(const o of shuffle(others(h))){
    if(o[key] && !opts.some(x=>x.text===o[key])) opts.push({text:o[key], ok:false});
    if(opts.length===4) break;
  }
  return shuffle(opts);
}
function makeNeed(h){
  const opts=[{text:fact(h), ok:true}];
  for(const o of shuffle(others(h))){
    const text=fact(o);
    if(!opts.some(x=>x.text===text)) opts.push({text, ok:false});
    if(opts.length===4) break;
  }
  return {kind:"need", type:"基礎必答", text:"請說明「"+h.n+"」的類別與性味。這題不出牌。", opts:shuffle(opts), reveal:fact(h)};
}
function makeKeyed(h, key, label){
  return {kind:"need", type:"基礎必答", text:"請說明「"+h.n+"」的"+label+"。這題不出牌。", opts:optionsFor(h, key), reveal:h[key]};
}
function makePlace(h){ return makeKeyed(h, "p", "產地"); }
function makeSource(h){ return makeKeyed(h, "o", "來源"); }
function makeQuality(h){ return makeKeyed(h, "q", "品質"); }
function makeEffect(h){ return makeKeyed(h, "e", "功效"); }
function makeScene(h){
  return {kind:"buzz", type:"情景", text:h.s+"。這是哪一種？搶答後只可交出一張牌。", test:card=>card.n===h.n, reveal:h.n};
}
function makeMatch(h){
  return {kind:"buzz", type:"配對", text:"「"+h.n+"」屬於"+h.c+"。請交出另一種同類的牌。", test:card=>card.n!==h.n && card.c===h.c, reveal:"另一種"+h.c};
}
function makeFact(h, key, label){
  return {kind:"fact", type:"搶答", text:"請說明「"+h.n+"」的"+label+"。搶答後先選這張牌，再選答案。", named:h.n, opts:optionsFor(h, key), reveal:h[key]};
}
function makeTF(h){
  const fields=[["c","類別"],["t","性味"],["o","來源"],["p","產地"],["q","品質"]];
  const pair=rand(fields);
  const key=pair[0], label=pair[1];
  const lie=Math.random()<0.5;
  let value=h[key], ans=true;
  if(lie){
    const o=rand(others(h).filter(x=>x[key] && x[key]!==h[key]));
    value=o[key];
    ans=false;
  }
  return {kind:"tf", type:"是非", text:"「"+h.n+"」的"+label+"是"+value+"。", named:h.n, ans:ans, reveal:(ans?"是":"否")+"。浸大："+h[key]};
}
function buildNeed(){
  const pool=shuffle(HERBS.slice());
  let i=0;
  const take=()=>pool[i++];
  return [makeNeed(take()), makePlace(take()), makeSource(take()), makeQuality(take()), makeEffect(take()), makeNeed(take())];
}
function buildBuzz(){
  const pool=shuffle(HERBS.slice());
  let i=0;
  const take=()=>pool[i++];
  return [makeScene(take()), makeMatch(take()), makeTF(take()), makeFact(take(),"o","來源"), makeScene(take()), makeTF(take()), makeFact(take(),"q","品質")];
}

function stop(){ if(tick){ clearInterval(tick); tick=null; } }
function speak(text, done){
  const token=++voiceToken;
  let ran=false;
  const finish=()=>{ if(ran||token!==voiceToken) return; ran=true; if(done) done(); };
  if(!window.speechSynthesis){ finish(); return; }
  window.speechSynthesis.cancel();
  setTimeout(()=>{
    if(token!==voiceToken) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-HK";
    u.rate=0.82;
    const voices=window.speechSynthesis.getVoices();
    const v=voices.find(x=>x.lang==="zh-HK")||voices.find(x=>x.lang&&x.lang.indexOf("zh")===0);
    if(v) u.voice=v;
    const wait=Math.max(4000, text.length*320);
    let extra=false;
    const backup=setTimeout(()=>{
      if(token!==voiceToken) return;
      if(!extra && window.speechSynthesis.speaking){ extra=true; setTimeout(finish, 1800); return; }
      finish();
    }, wait);
    u.onend=()=>{ clearTimeout(backup); finish(); };
    u.onerror=()=>{ clearTimeout(backup); finish(); };
    window.speechSynthesis.speak(u);
  }, 80);
}
function startTimer(sec, fn){
  stop();
  left=sec;
  paintClock();
  tick=setInterval(()=>{
    left-=1;
    paintClock();
    if(left<=0){ stop(); fn(); }
  }, 1000);
}

}

      choiceBox.appendChild(b);
    });
  }
  const playing=phase==="speak"||phase==="buzz"||phase==="answer"||phase==="review";
  document.getElementById("startNeed").hidden=playing;
  document.getElementById("startBuzz").hidden=playing;
  document.getElementById("buzz").hidden=!(mode==="buzz" && phase==="buzz");
  document.getElementById("yes").hidden=!(mode==="buzz" && phase==="answer" && q && q.kind==="tf");
  document.getElementById("no").hidden=!(mode==="buzz" && phase==="answer" && q && q.kind==="tf");
  document.getElementById("send").hidden=!(mode==="buzz" && phase==="answer" && q && q.kind==="buzz");
  document.getElementById("nextBtn").hidden=phase!=="review";
}
function say(s){ document.getElementById("msg").textContent=s; }
function showQ(){
  lock=false; selected=-1;
  document.getElementById("answer").hidden=true;
  if(hand.length===0){ return finish("牌沒有了，這一局淘汰。"); }
  if(qi>=qs.length){ return finish("這一場完成。"); }
  const q=qs[qi];
  const my=round;
  document.getElementById("tag").textContent=(qi+1)+" / "+qs.length+"　"+q.type;
  document.getElementById("text").textContent=q.text;
  say("");
  phase="speak";
  document.getElementById("hint").textContent="正在讀題。讀完才開始計時。";
  paint();
  paintClock();
  speak(q.text, ()=>{
    if(my!==round || phase!=="speak") return;
    if(q.kind==="need"){
      phase="answer";
      document.getElementById("hint").textContent="基礎必答：10 秒內選答案。不要出牌。";
    } else {
      phase="buzz";
      document.getElementById("hint").textContent="10 秒內按「搶答」。沒有搶答會少 1 張牌。";
    }
    paint();
    startTimer(10, ()=>fail(q.kind==="need"?"超時，抽走 1 張牌。":"沒有搶答，抽走 1 張牌。"));
  });
}
function buzz(){
  if(phase!=="buzz"||lock) return;
  stop();
  phase="answer";
  const q=qs[qi];
  document.getElementById("hint").textContent=q.kind==="tf"
    ? "先選這題藥材的牌，再按「是」或「否」。只可一人作答。"
    : q.kind==="fact"
    ? "先選「"+q.named+"」的牌，再選答案。"
    : "只可選一張牌，然後按「交出這一張」。";
  paint();
  startTimer(10, ()=>fail("作答超時，抽走 1 張牌。"));
}
function answerNeed(ok){
  if(phase!=="answer"||lock) return;
  lock=true; stop(); asked++;
  if(ok){ rights++; review("答對。必答題保留原有的牌。"); }
  else fail("答錯。抽走 1 張牌。", true);
}
function sendCard(){
  if(phase!=="answer"||lock) return;
  const q=qs[qi];
  if(selected<0){ say("先選一張牌。"); return; }
  lock=true; stop(); asked++;
  const card=hand[selected];
  if(q.test(card)) reviewRight("答對。向電腦抽 1 張。");
  else fail("答錯。抽走這張牌。", true);
}
function judgeTF(yes){
  if(phase!=="answer"||lock) return;
  const q=qs[qi];
  if(selected<0 || hand[selected].n!==q.named){
    lock=true; stop(); asked++;
    fail("沒有拿着「"+q.named+"」。以手上的牌為準，抽走 1 張。", true);
    return;
  }
  lock=true; stop(); asked++;
  if(yes===q.ans) reviewRight("答對。向電腦抽 1 張。");
  else fail("答錯。抽走這張牌。", true);
}
function judgeFact(ok){
  if(phase!=="answer"||lock) return;
  const q=qs[qi];
  if(selected<0 || hand[selected].n!==q.named){
    lock=true; stop(); asked++;
    fail("沒有拿着「"+q.named+"」。以手上的牌為準，抽走 1 張。", true);
    return;
  }
  lock=true; stop(); asked++;
  if(ok) reviewRight("答對。向電腦抽 1 張。");
  else fail("答錯。抽走這張牌。", true);
}
function dropOne(){
  if(!hand.length) return;
  const i=selected>=0 && selected<hand.length ? selected : Math.floor(Math.random()*hand.length);
  hand.splice(i,1);
  selected=-1;
}
function fail(message, already){
  if(!already){ lock=true; stop(); asked++; }
  dropOne();
  review(message, hand.length===0?"牌沒有了，這一場淘汰。":null);
}
function reviewRight(message){
  rights++;
  if(cpu>0 && deck.length){ cpu--; hand.push(deck.pop()); }
  review(message, null);
}
function review(message, ended){
  phase="review";
  stop();
  lock=true;
  pendingEnd=ended;
  const q=qs[qi];
  const box=document.getElementById("answer");
  box.hidden=false;
  box.textContent="正確："+(q&&q.reveal?q.reveal:"");
  say(message);
  document.getElementById("hint").textContent="看完正確答案，再按「下一題」。";
  paint();
  paintClock();
  if(q&&q.reveal) speak("正確答案是"+q.reveal);
}
function next(){ qi++; showQ(); }
function goNext(){
  if(phase!=="review") return;
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(pendingEnd){ const reason=pendingEnd; pendingEnd=null; finish(reason); return; }
  next();
}
function finish(reason){
  phase="over"; stop(); lock=true; mode="";
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById("answer").hidden=true;
  document.getElementById("tag").textContent="完結";
  document.getElementById("text").textContent=reason+"　答對 "+rights+" / "+asked+"。餘下 "+hand.length+" 張牌。";
  document.getElementById("hint").textContent="可再選基礎必答或搶答。比賽題目可以和這一場不同。";
  say("");
  paint();
  paintClock();
}
function begin(which){
  round++;
  pendingEnd=null;
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  mode=which;
  const pool=shuffle(HERBS.slice());
  hand=pool.slice(0,10);
  deck=pool.slice(10);
  cpu=8;
  qs=which==="need"?buildNeed():buildBuzz();
  qi=0; rights=0; asked=0;
  showQ();
}
document.getElementById("buzz").onclick=buzz;
document.getElementById("send").onclick=sendCard;
document.getElementById("yes").onclick=()=>judgeTF(true);
document.getElementById("no").onclick=()=>judgeTF(false);
document.getElementById("startNeed").onclick=()=>begin("need");
document.getElementById("startBuzz").onclick=()=>begin("buzz");
document.getElementById("nextBtn").onclick=goNext;
document.addEventListener("keydown", e=>{
  if(e.key===" " && phase==="buzz"){ e.preventDefault(); buzz(); }
  if(e.key==="Enter" && phase==="review"){ e.preventDefault(); goNext(); }
});
if(window.speechSynthesis) window.speechSynthesis.getVoices();
</script>
</body>
</html>
